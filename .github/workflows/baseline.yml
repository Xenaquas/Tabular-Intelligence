name: Baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependency manager
        run: python -m pip install uv==0.11.21
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Verify runtime requirements export
        shell: bash
        run: |
          uv export --locked --no-dev --format requirements-txt --output-file requirements.txt > /dev/null
          git diff --exit-code -- requirements.txt
      - name: Compile and import active modules without network
        run: uv run --locked python scripts/check_baseline.py
      - name: Run offline tests and verify live-test skips
        run: uv run --locked pytest -q
