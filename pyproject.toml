[project]
name = "tabular-intelligence"
version = "0.1.0"
description = "Strands-based conversational tabular analytics proof of concept"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35,<2",
    "strands-agents[openai]>=1,<2",
    "boto3>=1.34,<2",
    "botocore>=1.34,<2",
    "langchain-aws>=1.7,<2",
    "langchain-core>=1.6,<2",
    "duckdb>=1,<2",
    "numpy>=1.26,<3",
    "pandas>=2,<3",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "pyarrow>=14",
    "faiss-cpu>=1.7.4,<2",
    "rapidfuzz>=3,<4",
    "requests>=2.31,<3",
    "scipy>=1.11,<2",
    "plotly>=5.18,<7",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "tabulate>=0.9,<1",
    "sqlglot>=27,<28",
    "oracledb>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-socket>=0.7,<1"]

[tool.uv]
package = false
required-version = "==0.11.21"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config --disable-socket -ra"
markers = [
    "integration: explicit live-service integration tests",
    "bedrock: opt-in paid AWS Bedrock inference (requires --run-bedrock)",
    "nomic: opt-in local Nomic endpoint (requires --run-nomic)",
    "oracle: opt-in local Oracle endpoint (requires --run-oracle)",
]
